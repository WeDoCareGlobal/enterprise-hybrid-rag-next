[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-hybrid-rag"
version = "1.0.0-pre.1"
description = "Production RAG with NVIDIA NeMo retrieval, hybrid dense/lexical search, reranking, and evaluation layer."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Emir Perla", email = "emirperla96@gmail.com"}
]
keywords = ["RAG", "retrieval-augmented generation", "NVIDIA NeMo", "hybrid retrieval", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.8.2",
    "pydantic>=2.6.4",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "eval*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]
eval = [
    "ragas>=0.1.7",
    "datasets>=2.18.0",
]
nemo = [
    "nemo-toolkit[asr]>=1.0",  # TTS not installable on Windows
]

[project.scripts]
ehr = "app.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]