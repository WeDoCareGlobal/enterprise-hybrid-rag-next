version: "3.8"

# NVIDIA GPU configuration for NVIDIA NIM embedding models.
# GPU fractions allow multiple NIMs to share a single GPU with request/limit
# allocation, delivering up to 1.4x throughput and 1.7x lower latency vs
# static dedicated-GPU allocation at high concurrency.
x-nvidia: &nvidia
  # GPU memory swap: keeps model weights in CPU memory, dynamically swaps
  # to GPU on request. Delivers 44-61x faster time-to-first-token vs scale-from-zero.
  # GPU fractions: request = guaranteed minimum, limit = burstable upper bound.
  runtime: nvidia
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]
            device_ids: [0]
            options:
              # GPU memory swap: keep model weights in CPU when idle
              - gpus=count=1,memory=20GB,swapsize=80GB

services:
  ehr-api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - NIM_ENABLED=${NIM_ENABLED:-false}
      - NIM_API_KEY=${NIM_API_KEY:-}
      - NIM_BASE_URL=${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NIM_EMBEDDING_MODEL=${NIM_EMBEDDING_MODEL:-nemotron-3-ultra-550b}
      - NIM_TIMEOUT=${NIM_TIMEOUT:-30}
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.8.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data: